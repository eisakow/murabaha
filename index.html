<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калькулятор Мурабаха</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #f3f4f6;
    color: #111;
}

.container {
    max-width: 900px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 15px;
}

h1 {
    text-align: center;
    margin-bottom: 25px;
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.field {
    display: flex;
    flex-direction: column;
}

.field label {
    font-weight: bold;
    margin-bottom: 6px;
}

.field input,
.field select {
    padding: 11px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}

button {
    border: none;
    border-radius: 8px;
    padding: 13px 20px;
    font-size: 16px;
    cursor: pointer;
}

.calculate {
    width: 100%;
    margin-top: 20px;
    background: #111827;
    color: white;
}

.pdf {
    background: #2563eb;
    color: white;
    margin-top: 15px;
    width: 100%;
}

/* PDF */
.pdf-page {
    display: none;
}

.summary {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 25px;
    background: #f5f6f7;
    padding: 25px;
    border-radius: 15px;
    margin-bottom: 20px;
}

.info {
    line-height: 1.9;
    font-size: 17px;
}

.result {
    background: #eef1f4;
    padding: 20px;
    border-radius: 15px;
    line-height: 2;
    font-size: 17px;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
}

th,
td {
    border: 1px solid #ddd;
    padding: 10px;
    text-align: center;
}

th {
    background: #f0f0f0;
}

.error {
    color: red;
    margin-top: 10px;
}

/* Печать / PDF */
@media print {

    @page {
        size: A4;
        margin: 12mm;
    }

    body {
        background: white;
        padding: 0;
    }

    .calculator {
        display: none !important;
    }

    .pdf-page {
        display: block !important;
    }

    .pdf-page h1 {
        font-size: 25px;
        margin: 0 0 20px;
    }

    .summary {
        display: grid !important;
        grid-template-columns: 1fr 1fr !important;
        gap: 20px;
        background: #f5f6f7 !important;
        padding: 18px;
        border-radius: 12px;
    }

    .info,
    .result {
        font-size: 14px;
    }

    table {
        font-size: 13px;
    }

    th,
    td {
        padding: 7px;
    }

    button {
        display: none !important;
    }
}
</style>
</head>

<body>

<div class="container calculator">

    <h1>Калькулятор Мурабаха</h1>

    <div class="form-grid">

        <div class="field">
            <label>Имя и фамилия клиента</label>
            <input type="text" id="client" placeholder="Например: Erzat Isakov">
        </div>

        <div class="field">
            <label>Наименование товара</label>
            <input type="text" id="product" placeholder="Например: iPhone 17 Pro Max">
        </div>

        <div class="field">
            <label>Цена товара, сом</label>
            <input type="number" id="price" placeholder="120000">
        </div>

        <div class="field">
            <label>Первоначальный взнос, сом</label>
            <input type="number" id="downPayment" value="0">
        </div>

        <div class="field">
            <label>Годовая наценка, %</label>
            <input type="number" id="markup" value="30">
        </div>

        <div class="field">
            <label>Срок, месяцев</label>
            <select id="months">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10</option>
                <option value="11">11</option>
                <option value="12" selected>12</option>
            </select>
        </div>

        <div class="field">
            <label>Дата первой оплаты</label>
            <input type="date" id="firstDate">
        </div>

    </div>

    <button class="calculate" onclick="calculate()">
        Рассчитать
    </button>

    <div id="error" class="error"></div>

</div>


<!-- PDF СТРАНИЦА -->

<div class="pdf-page">

    <h1>График погашения Мурабаха</h1>

    <div class="summary">

        <!-- ЛЕВАЯ ЧАСТЬ -->

        <div class="info">

            <div>
                <b>Клиент:</b>
                <span id="pdfClient"></span>
            </div>

            <div>
                <b>Товар:</b>
                <span id="pdfProduct"></span>
            </div>

            <div>
                <b>Цена товара:</b>
                <span id="pdfPrice"></span>
            </div>

            <div>
                <b>Первоначальный взнос:</b>
                <span id="pdfDown"></span>
            </div>

            <div>
                <b>Сумма после взноса:</b>
                <span id="pdfAfterDown"></span>
            </div>

            <div>
                <b>Срок:</b>
                <span id="pdfMonths"></span>
            </div>

        </div>


        <!-- ПРАВАЯ ЧАСТЬ -->

        <div class="result">

            <div>
                <b>Наценка:</b>
                <span id="pdfMarkup"></span>
            </div>

            <div>
                <b>Сумма рассрочки:</b>
                <span id="pdfInstallment"></span>
            </div>

            <div>
                <b>Общая сумма:</b>
                <span id="pdfTotal"></span>
            </div>

            <div>
                <b>Ежемесячный платёж:</b>
                <span id="pdfMonthly"></span>
            </div>

            <div>
                <b>Число погашения:</b>
                <span id="pdfPaymentNumber"></span>
            </div>

        </div>

    </div>


    <table>

        <thead>
            <tr>
                <th>№</th>
                <th>Дата</th>
                <th>Платёж</th>
                <th>Остаток</th>
            </tr>
        </thead>

        <tbody id="paymentTable"></tbody>

    </table>

    <button class="pdf" onclick="window.print()">
        Сохранить / Печать PDF
    </button>

</div>


<script>

function formatMoney(number) {
    return Math.round(number)
        .toLocaleString("ru-RU") + " сом";
}


function formatDate(date) {

    let d = String(date.getDate()).padStart(2, "0");
    let m = String(date.getMonth() + 1).padStart(2, "0");
    let y = date.getFullYear();

    return d + "." + m + "." + y;
}


function addMonths(date, months) {

    let result = new Date(date);

    result.setMonth(result.getMonth() + months);

    return result;
}


function calculate() {

    const client =
        document.getElementById("client").value;

    const product =
        document.getElementById("product").value;

    const price =
        Number(document.getElementById("price").value);

    const down =
        Number(document.getElementById("downPayment").value);

    const annualMarkup =
        Number(document.getElementById("markup").value);

    const months =
        Number(document.getElementById("months").value);

    const firstDateValue =
        document.getElementById("firstDate").value;


    const error =
        document.getElementById("error");

    error.innerHTML = "";


    if (!price || price <= 0) {
        error.innerHTML = "Введите цену товара.";
        return;
    }


    if (down < 0 || down >= price) {
        error.innerHTML =
            "Первоначальный взнос должен быть меньше цены товара.";
        return;
    }


    if (!firstDateValue) {
        error.innerHTML =
            "Выберите дату первой оплаты.";
        return;
    }


    /*
       Сумма после первоначального взноса
    */

    const afterDown = price - down;


    /*
       Наценка считается только
       от суммы после первоначального взноса.

       Например:

       Цена = 120 000
       Взнос = 20 000
       Остаток = 100 000
       30% годовых
       6 месяцев = 15%

       Наценка = 15 000
    */

    const markupPercent =
        annualMarkup * months / 12;


    const markupAmount =
        afterDown * markupPercent / 100;


    const installmentAmount =
        afterDown + markupAmount;


    /*
       В данном шаблоне:

       "Сумма рассрочки" = сумма с наценкой
       "Общая сумма" = первоначальный взнос
                         + сумма рассрочки
    */

    const totalAmount =
        down + installmentAmount;


    const monthly =
        installmentAmount / months;


    /*
       Заполняем PDF
    */

    document.getElementById("pdfClient").textContent =
        client || "—";

    document.getElementById("pdfProduct").textContent =
        product || "—";

    document.getElementById("pdfPrice").textContent =
        formatMoney(price);

    document.getElementById("pdfDown").textContent =
        formatMoney(down);

    document.getElementById("pdfAfterDown").textContent =
        formatMoney(afterDown);

    document.getElementById("pdfMonths").textContent =
        months + " мес.";

    document.getElementById("pdfMarkup").textContent =
        markupPercent.toFixed(2) +
        "% (" +
        formatMoney(markupAmount) +
        ")";

    document.getElementById("pdfInstallment").textContent =
        formatMoney(installmentAmount);

    document.getElementById("pdfTotal").textContent =
        formatMoney(totalAmount);

    document.getElementById("pdfMonthly").textContent =
        formatMoney(Math.round(monthly));

    document.getElementById("pdfPaymentNumber").textContent =
        months;


    /*
       Таблица платежей
    */

    const table =
        document.getElementById("paymentTable");

    table.innerHTML = "";


    let remaining =
        installmentAmount;


    const firstDate =
        new Date(firstDateValue + "T00:00:00");


    for (let i = 1; i <= months; i++) {

        let payment;

        /*
           Последний платёж корректируется,
           чтобы остаток был ровно 0.
        */

        if (i === months) {
            payment = remaining;
        } else {
            payment = Math.round(monthly);
        }


        remaining -= payment;

        if (Math.abs(remaining) < 1) {
            remaining = 0;
        }


        const paymentDate =
            addMonths(firstDate, i - 1);


        const row =
            document.createElement("tr");


        row.innerHTML = `

            <td>${i}</td>

            <td>
                ${formatDate(paymentDate)}
            </td>

            <td>
                ${formatMoney(payment)}
            </td>

            <td>
                ${formatMoney(remaining)}
            </td>

        `;


        table.appendChild(row);
    }


    /*
       Переходим к PDF-странице
    */

    document.querySelector(".calculator")
        .style.display = "none";

    document.querySelector(".pdf-page")
        .style.display = "block";


    /*
       Автоматически открываем печать
    */

    setTimeout(() => {
        window.print();
    }, 300);
}


/*
   После закрытия окна печати
   возвращаем калькулятор
*/

window.onafterprint = function() {

    document.querySelector(".calculator")
        .style.display = "block";

    document.querySelector(".pdf-page")
        .style.display = "none";

};

</script>

</body>
</html>
